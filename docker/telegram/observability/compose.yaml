# Observability of the services on the VPS, included by ../compose.prod.yaml: one project, one
# `docker compose up`. The services send traces, metrics and logs over OTLP to Alloy
# (alloy:4317 gRPC, alloy:4318 HTTP), which passes them on:
#   metrics → Prometheus  30 days (5 GB at most)   prometheus/prometheus.yml, the flags below
#   logs    → Loki        14 days                  loki/loki.yaml, limits_config.retention_period
#   traces  → Tempo        7 days                  tempo/tempo.yaml, block_retention
# Alloy also collects the VPS's own metrics (CPU, memory, disk), so a filling disk shows.
#
# Grafana, already on the VPS, reads the three stores: on the host they answer on 127.0.0.1 only
# (9090, 3100, 3200); a Grafana in Docker joins the network stickersnap-telemetry and reads them as
# prometheus:9090, loki:3100 and tempo:3200. grafana/datasources.yaml sets them up with the links
# between them (a log line → its trace, a span → its logs). Nothing here is open to the internet.

services:
  alloy:
    image: grafana/alloy:v1.21.2
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # the VPS's own metrics (prometheus.exporter.unix), read only
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    # No ports: the services reach it over the compose network
    depends_on:
      - prometheus
      - loki
      - tempo
    mem_limit: 256m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      # Alloy writes the services' metrics here (prometheus.remote_write)
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [default, telemetry]
    mem_limit: 512m
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks: [default, telemetry]
    mem_limit: 512m
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    networks: [default, telemetry]
    mem_limit: 512m
    restart: unless-stopped

networks:
  # for a Grafana that runs in Docker: networks: { stickersnap-telemetry: { external: true } }
  telemetry:
    name: stickersnap-telemetry

volumes:
  alloy-data:
  prometheus-data:
  loki-data:
  tempo-data:
