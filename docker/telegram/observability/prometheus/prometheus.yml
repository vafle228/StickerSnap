# The services' metrics arrive from Alloy by remote write; Prometheus scrapes only the stores
# themselves, to see them fill up. Retention is in the flags of compose.yaml (30d, 5GB).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
