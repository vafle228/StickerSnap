# Development: Grafana with Prometheus, Loki and Tempo in one container (grafana/otel-lgtm), to see
# what the bot sends before it reaches the VPS. Not for production: nothing is kept long.
#   docker compose -f docker/telegram/observability/compose.dev.yaml up
# then run the bot with OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 in .env and open
# http://127.0.0.1:3000 (admin / admin).
name: stickersnap-observability-dev

services:
  lgtm:
    image: grafana/otel-lgtm:0.38.0
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
