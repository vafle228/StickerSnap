# The bot service, locally: `docker compose -f docker/telegram/compose.yaml up --build`.
# The token and the other settings come from .env in the repository root; it is never in git or in
# the image. The VPS runs compose.prod.yaml instead.
name: stickersnap-bot

services:
  bot:
    build:
      context: ../../src/telegram/bot
      dockerfile: ../../../docker/telegram/Dockerfile
    env_file: ../../.env
    # Only this computer reaches it
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - bot-data:/data
    restart: unless-stopped

volumes:
  # SQLite lives here
  bot-data:
