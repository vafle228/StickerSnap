# The bot service. Locally: `docker compose -f docker/bot/compose.yaml up --build`.
# The token and the other settings come from .env (the repository root by default, beside
# compose.yaml on the VPS with BOT_ENV_FILE=./.env); it is never in git or in the image.
name: stickersnap-bot

services:
  bot:
    build:
      context: ../../src/bot
      dockerfile: ../../docker/bot/Dockerfile
    env_file: ${BOT_ENV_FILE:-../../.env}
    # Only the TLS proxy on the same host talks to the service (O1)
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - bot-data:/data
    restart: unless-stopped

volumes:
  # SQLite lives here; the daily backup copies this volume
  bot-data:
