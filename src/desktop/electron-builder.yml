# Installers for Windows and Linux (plan, stage 1b): npm run dist -w src/desktop after
# `npm run build` (the SPA into the server's wwwroot), `npm run server -w src/desktop` and
# `npm run fetch:ffmpeg` and `npm run fetch:ytdlp` (the pinned FFmpeg and yt-dlp into tools/).
# npm run package does all of it.
appId: app.stickersnap.desktop
productName: StickerSnap
copyright: Copyright © 2026 StickerSnap

directories:
  output: release
  buildResources: assets

# The shell has no runtime dependencies: its compiled code and the window icons are all it needs.
files:
  - package.json
  - dist/**/*
  - assets/icon.png
  - assets/icon.ico

# The self-contained server with the SPA in its wwwroot, outside the asar archive: it runs as is.
# The pinned FFmpeg and yt-dlp lie next to it, where the server looks before PATH (FfmpegLocator.cs,
# YtDlpLocator.cs).
extraResources:
  - from: server-dist/${os}-${arch}
    to: server
  - from: ../../tools/ffmpeg/${os}-${arch}
    to: server
    filter: ["ffmpeg", "ffmpeg.exe", "ffprobe", "ffprobe.exe"]
  # FFmpeg is LGPL: its license goes with it
  - from: ../../tools/ffmpeg/${os}-${arch}/LICENSE.txt
    to: server/FFmpeg-LICENSE.txt
  # yt-dlp for the import by link (YouTube), with its license and those of what it bundles
  - from: ../../tools/yt-dlp/${os}-${arch}
    to: server
    filter: ["yt-dlp", "yt-dlp.exe"]
  - from: ../../tools/yt-dlp/${os}-${arch}/LICENSE.txt
    to: server/yt-dlp-LICENSE.txt
  - from: ../../tools/yt-dlp/${os}-${arch}/THIRD_PARTY_LICENSES.txt
    to: server/yt-dlp-THIRD_PARTY_LICENSES.txt

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: StickerSnap
  artifactName: StickerSnap-Setup-${version}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: assets/icon.png
  category: Graphics
  executableName: stickersnap
  synopsis: Telegram video sticker editor
  artifactName: StickerSnap-${version}-${arch}.${ext}

deb:
  packageName: stickersnap

publish: null
