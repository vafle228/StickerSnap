openapi: 3.1.0
info:
  title: StickerSnap bot service API
  version: 1.0.0
  summary: Контракт облачного сервиса @StickerSnapAppBot (src/telegram/bot).
  description: |
    Машиночитаемая копия разделов «Облачный сервис · API Mini App», «Облачный сервис · Отзывы»,
    «Облачный сервис · Привязка» и «Облачный сервис · Публикация» документа
    «StickerSnap — API-контракт»
    (https://claude.ai/code/artifact/27a215ce-d7a8-4824-a719-5c52df747dd6). Документ — единственный
    источник правды: любое изменение сначала закрепляется в нём, затем здесь.

    API облачного сервиса, единственного владельца токена бота (план бота, docs/bot-plan.md).
    Здесь API Mini App (задача S6), приём отзывов (F1), привязка десктопа (S4) и публикация
    с десктопа (S5). После изменения: `npm run gen:api`.

    Транспорт: HTTPS, все пути под `/v1`. Mini App отдаётся с того же адреса, поэтому
    ходит на относительные пути, без CORS.

    Доступ Mini App: каждый запрос несёт `Authorization: tma <initData>`, где `initData` —
    строка `Telegram.WebApp.initData` как есть. Сервис проверяет её подпись токеном бота
    и срок (`auth_date`), а пользователя берёт из неё, а не из запроса. Без подписи,
    с чужой или устаревшей подписью — 401 `unauthorized`, и Mini App показывает
    «Не получилось войти» (артборд 14, состояние 4).

    Медиа: `thumbUrl` и `videoUrl` стикеров и `coverUrl` пака — готовые адреса, которые
    браузер грузит сам (`<img>`, `<video>`) без заголовка. Сервис подписывает их на короткий
    срок и сам ходит за файлом в Bot API: адрес файла Telegram несёт токен бота и наружу
    не попадает.

    Формат: JSON, поля в camelCase, перечисления — строки, даты — ISO 8601 в UTC,
    необязательное поле отсутствует, а не `null`. Сервис не присылает текст для человека,
    только коды; фразы живут в Mini App.

    Ошибки: RFC 9457 Problem Details (`application/problem+json`) с полем `code`
    из `ErrorCode`, как в контракте десктопа (src/contract/openapi.yaml).

servers:
  - url: /

security:
  - telegramInitData: []

tags:
  - name: miniapp
    description: Mini App — паки и устройства пользователя Telegram
  - name: feedback
    description: Отзывы с десктопа и из Mini App
  - name: link
    description: Привязка десктопа к аккаунту Telegram и его ключ устройства
  - name: publish
    description: Публикация с привязанного десктопа — паки и стикеры от имени владельца ключа

paths:
  /v1/miniapp/packs:
    get:
      tags: [miniapp]
      operationId: listPacks
      summary: Паки, которые бот создал для этого пользователя
      description: Свежие сверху (по `updatedAt`). Пак, которого Telegram больше не знает, приходит с `state = missing`.
      responses:
        "200":
          description: Паки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/TelegramError"

  /v1/miniapp/packs/{name}:
    parameters:
      - $ref: "#/components/parameters/PackName"
    get:
      tags: [miniapp]
      operationId: getPack
      summary: Пак со стикерами в их порядке в Telegram
      responses:
        "200":
          description: Пак
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/TelegramError"
    delete:
      tags: [miniapp]
      operationId: forgetPack
      summary: Убрать из списка пак, которого нет в Telegram
      description: |
        Только для пака с `state = missing` (артборд 14, состояние 6): стирает его у сервиса,
        в Telegram его уже нет. Пак, который Telegram знает, — 409 `pack_in_telegram`.
      responses:
        "204":
          description: Убран
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/miniapp/packs/{name}/stickers/{stickerId}:
    parameters:
      - $ref: "#/components/parameters/PackName"
      - name: stickerId
        in: path
        required: true
        description: "`Sticker.id`"
        schema:
          type: string
    delete:
      tags: [miniapp]
      operationId: deleteSticker
      summary: Удалить стикер из пака
      description: |
        deleteStickerFromSet от имени бота. Последний стикер уносит с собой пак: Telegram
        удаляет пустой набор, и сервис забывает его.
      responses:
        "204":
          description: Удалён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/TelegramError"

  /v1/miniapp/devices:
    get:
      tags: [miniapp]
      operationId: listDevices
      summary: Компьютеры, привязанные к этому пользователю
      description: Новые сверху (по `linkedAt`).
      responses:
        "200":
          description: Устройства
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/miniapp/devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [miniapp]
      operationId: unlinkDevice
      summary: Отвязать компьютер
      description: Ключ устройства отзывается; компьютер узнает об этом по 401 на следующем вызове.
      responses:
        "204":
          description: Отвязан
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/feedback:
    post:
      tags: [feedback]
      operationId: sendFeedback
      summary: Отправить отзыв или отчёт об ошибке
      description: |
        Сервис сохраняет отзыв в таблицу `feedback` и пересылает в чат отзывов (`FEEDBACK_CHAT_ID`),
        сведения — файлом `diagnostics-<id>.txt` ответом на это сообщение. 201 приходит, когда
        отзыв сохранён: если Telegram не принял пересылку, отзыв остаётся в базе неотправленным.

        Доступ, один из трёх: Mini App — `tma <initData>`; привязанный десктоп — `Bearer <ключ
        устройства>`; непривязанный десктоп — без заголовка, тогда `installationId` обязателен.
        С `tma` отзыв из Mini App, иначе с десктопа.

        Лимит: 5 отзывов в час на аккаунт Telegram (Mini App и его компьютеры вместе) или на
        установку без привязки; без привязки ещё 10 в час с одного IP. Сверх — 429 `rate_limited`.

        Правила тела сверх схемы (иначе 400 `bad_request`): `text` пустой только у `bug` с `error`;
        `error` и `diagnostics` только у `bug`, `diagnostics` только с десктопа и не больше
        204 800 байт в UTF-8; `contact` только без привязки и при `canReply`.
      security:
        - telegramInitData: []
        - deviceKey: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "201":
          description: Сохранён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/links:
    post:
      tags: [link]
      operationId: createLink
      summary: Выдать код привязки
      description: |
        Десктоп нажал «Привязать»: код живёт 10 минут, `deepLink` открывает Mini App на экране
        «Привязать этот компьютер?» (артборд 18·1), тот же адрес — в QR. `pollToken` — секрет для
        ожидания и отмены; сервис хранит только его хеш.

        Лимит: 10 кодов в час на установку (`installationId`) и 30 в час с одного IP, сверх —
        429 `rate_limited`.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkRequestBody"
      responses:
        "201":
          description: Код выдан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/links/{code}:
    parameters:
      - $ref: "#/components/parameters/LinkCode"
    get:
      tags: [link]
      operationId: getLinkState
      summary: Ждать ответа на код привязки
      description: |
        Долгий запрос: пока код ждёт ответа, сервис держит запрос до `wait` секунд и отвечает,
        как только человек ответил в Mini App. После «Привязать» отдаёт ключ устройства — один
        раз, дальше код `expired`. Чужой `pollToken` и неизвестный код — 404 `link_not_found`.
      security:
        - pollToken: []
      parameters:
        - name: wait
          in: query
          required: false
          description: Сколько секунд ждать ответа, 0–25
          schema:
            type: integer
            minimum: 0
            maximum: 25
            default: 0
      responses:
        "200":
          description: Состояние кода
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [link]
      operationId: cancelLink
      summary: Отменить код привязки
      description: «Отмена» на десктопе. Код сгорает, Mini App покажет «Ссылка устарела».
      security:
        - pollToken: []
      responses:
        "204":
          description: Отменён
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/device:
    get:
      tags: [link]
      operationId: getDevice
      summary: Этот компьютер и его аккаунт Telegram
      description: Проверка ключа при запуске десктопа. Отозванный ключ — 401 `unauthorized`.
      security:
        - deviceKey: []
      responses:
        "200":
          description: Привязан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedDevice"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [link]
      operationId: unlinkThisDevice
      summary: Отвязать этот компьютер
      description: Ключ отзывается, компьютер пропадает из «Устройств» в Mini App.
      security:
        - deviceKey: []
      responses:
        "204":
          description: Отвязан
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/miniapp/links/{code}:
    parameters:
      - $ref: "#/components/parameters/LinkCode"
    get:
      tags: [miniapp]
      operationId: getLinkRequest
      summary: Запрос на привязку компьютера
      description: |
        Экран 18·1. Код, который истёк, уже использован, отменён или не найден, — 404
        `link_not_found` (экран 18·3).
      responses:
        "200":
          description: Запрос ждёт ответа
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/miniapp/links/{code}/confirm:
    parameters:
      - $ref: "#/components/parameters/LinkCode"
    post:
      tags: [miniapp]
      operationId: confirmLink
      summary: Привязать компьютер
      description: |
        «Привязать» от имени того, кто открыл Mini App. Повтор тем же человеком — снова 204.
        `notifications` запоминается за аккаунтом: выключенные уведомления бот не шлёт.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkConfirmBody"
      responses:
        "204":
          description: Подтверждено
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/miniapp/links/{code}/decline:
    parameters:
      - $ref: "#/components/parameters/LinkCode"
    post:
      tags: [miniapp]
      operationId: declineLink
      summary: Это не я
      description: Код сгорает, десктоп получает `declined` (экран 18·4).
      responses:
        "204":
          description: Отклонено
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/stickers/upload:
    post:
      tags: [publish]
      operationId: uploadSticker
      summary: Загрузить .webm стикера
      description: |
        uploadStickerFile от имени владельца ключа. `id` годится для создания пака, добавления
        и замены, так что повтор не грузит файл снова. Больше 262 144 байт или не WebM
        (нет заголовка EBML) — 422 `validation_failed`, пустое тело — 400 `bad_request`.
      security:
        - deviceKey: []
      requestBody:
        required: true
        content:
          video/webm:
            schema:
              type: string
              format: binary
              maxLength: 262144
      responses:
        "201":
          description: Загружен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedSticker"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BotBlocked"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/TelegramError"

  /v1/packs:
    post:
      tags: [publish]
      operationId: createPack
      summary: Создать пак
      description: |
        createNewStickerSet с 1–50 стикерами; пак записывается за владельцем ключа, бот пишет
        «Пак создан». Имя без суффикса `_by_<бот>` — 422 `pack_name_invalid` без запроса
        в Telegram; имя занято — 409 `pack_name_taken`.
      security:
        - deviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPackBody"
      responses:
        "201":
          description: Создан, пак после создания
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedPack"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BotBlocked"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/TelegramError"

  /v1/packs/{name}:
    parameters:
      - $ref: "#/components/parameters/PackName"
    get:
      tags: [publish]
      operationId: getPublishedPack
      summary: Пак, как его видит Telegram сейчас
      description: |
        Чужой пак, пак не из реестра сервиса и пак, которого Telegram не знает, — 404
        `pack_not_found`.
      security:
        - deviceKey: []
      responses:
        "200":
          description: Пак
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedPack"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/TelegramError"

  /v1/packs/{name}/stickers:
    parameters:
      - $ref: "#/components/parameters/PackName"
    post:
      tags: [publish]
      operationId: addSticker
      summary: Добавить стикер в конец пака
      description: |
        addStickerToSet; бот пишет «В пак добавлено N стикеров», подряд идущие добавления
        в один пак правят это сообщение. Полный пак — 409 `pack_full`.
      security:
        - deviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InputSticker"
      responses:
        "200":
          description: Добавлен, пак после добавления
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedPack"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BotBlocked"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/TelegramError"

  /v1/packs/{name}/stickers/{stickerId}:
    parameters:
      - $ref: "#/components/parameters/PackName"
      - name: stickerId
        in: path
        required: true
        description: "`PublishedSticker.id`"
        schema:
          type: string
    put:
      tags: [publish]
      operationId: replaceSticker
      summary: Заменить стикер на том же месте
      description: replaceStickerInSet, без уведомления. Стикера нет в паке — 404 `sticker_not_found`.
      security:
        - deviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InputSticker"
      responses:
        "200":
          description: Заменён, пак после замены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedPack"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BotBlocked"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/TelegramError"
    delete:
      tags: [publish]
      operationId: removeSticker
      summary: Удалить стикер из пака
      description: |
        Как `deleteSticker` в Mini App, без уведомления: последний стикер уносит с собой пак,
        и сервис забывает его.
      security:
        - deviceKey: []
      responses:
        "204":
          description: Удалён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/TelegramError"

  /v1/stickers/{stickerId}/file:
    parameters:
      - name: stickerId
        in: path
        required: true
        description: "`PublishedSticker.id`"
        schema:
          type: string
    get:
      tags: [publish]
      operationId: downloadSticker
      summary: Файл стикера
      description: |
        .webm стикера, чтобы десктоп показывал его со своего диска. Нет такого файла — 404
        `sticker_not_found`.
      security:
        - deviceKey: []
      responses:
        "200":
          description: Файл
          content:
            video/webm:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/TelegramError"

components:
  securitySchemes:
    telegramInitData:
      type: apiKey
      in: header
      name: Authorization
      description: "`tma <Telegram.WebApp.initData>`"
    deviceKey:
      type: http
      scheme: bearer
      description: Ключ устройства, который десктоп получил при привязке (S4)
    pollToken:
      type: http
      scheme: bearer
      description: "`pollToken` из ответа на `POST /v1/links`"

  parameters:
    PackName:
      name: name
      in: path
      required: true
      description: Имя набора в Telegram, с суффиксом `_by_<бот>`
      schema:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9_]{0,63}$"
    LinkCode:
      name: code
      in: path
      required: true
      description: Код привязки, `startapp=link_<code>`
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,64}$"

  responses:
    BadRequest:
      description: "`bad_request` — тело не по контракту"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: "`unauthorized` — нет подписи initData, она чужая или устарела; ключ устройства отозван"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "`pack_not_found`, `sticker_not_found`, `device_not_found`, `link_not_found`"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BotBlocked:
      description: "`bot_blocked` — человек остановил бота или не нажимал Start: бот не может действовать за него"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "`pack_in_telegram`, `pack_name_taken`, `pack_full`"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: "`validation_failed` — файл не WebM или больше 262 144 байт; `pack_name_invalid` — имя без `_by_<бот>` или не по правилам Telegram"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: "`rate_limited` — Telegram или лимит сервиса просят подождать, `params.retryAfterSec`"
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TelegramError:
      description: "`telegram_error` — Telegram не ответил или ответил ошибкой"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    PackList:
      type: object
      required: [packs]
      properties:
        packs:
          type: array
          items:
            $ref: "#/components/schemas/Pack"

    Pack:
      type: object
      required: [name, title, kind, count, limit, state, updatedAt]
      properties:
        name:
          type: string
          examples: [reactions_call_by_StickerSnapAppBot]
        title:
          type: string
          examples: [Реакции с созвона]
        kind:
          $ref: "#/components/schemas/PackKind"
        count:
          type: integer
          minimum: 0
          description: Стикеров в паке сейчас
        limit:
          type: integer
          description: Сколько Telegram примет всего (120 стикеров, 200 эмодзи); `count = limit` — «Заполнен»
        state:
          $ref: "#/components/schemas/PackState"
        coverUrl:
          type: string
          description: Первый кадр первого стикера (или обложка пака); нет у пустого или пропавшего пака
        updatedAt:
          type: string
          format: date-time

    PackKind:
      type: string
      enum: [stickers, emoji]

    PackState:
      type: string
      description: "`missing` — Telegram этого пака не знает (удалён через @Stickers)"
      enum: [ok, missing]

    PackDetail:
      allOf:
        - $ref: "#/components/schemas/Pack"
        - type: object
          required: [stickers]
          properties:
            stickers:
              type: array
              description: В порядке Telegram; у пропавшего пака пусто
              items:
                $ref: "#/components/schemas/Sticker"

    Sticker:
      type: object
      required: [id, emoji, thumbUrl, videoUrl]
      properties:
        id:
          type: string
          description: "`file_id` стикера в Telegram"
        emoji:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
          examples: [["😴", "💤"]]
        thumbUrl:
          type: string
          description: Первый кадр (thumbnail из Bot API), для сетки
        videoUrl:
          type: string
          description: Сам .webm, для листа просмотра

    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"

    Device:
      type: object
      required: [id, name, os, linkedAt]
      properties:
        id:
          type: string
        name:
          type: string
          description: Имя компьютера, как его прислал десктоп при привязке
          examples: [DESKTOP-7F3K2Q]
        os:
          $ref: "#/components/schemas/DeviceOs"
        linkedAt:
          type: string
          format: date-time

    FeedbackRequest:
      type: object
      required: [type, text, canReply]
      additionalProperties: false
      properties:
        type:
          $ref: "#/components/schemas/FeedbackType"
        text:
          type: string
          maxLength: 2000
          description: Пустой только у `bug` с `error`
          examples: [После публикации пак в «Моих паках» показывает 0 стикеров]
        canReply:
          type: boolean
          description: «Можно ответить мне»
        contact:
          type: string
          minLength: 1
          maxLength: 100
          description: Только без привязки и при `canReply`; e-mail или @username
          examples: [me@example.com]
        installationId:
          type: string
          format: uuid
          description: Установка десктопа; без привязки обязателен
        appVersion:
          type: string
          maxLength: 32
          examples: [0.3.1]
        platform:
          type: string
          maxLength: 64
          description: Система десктопа или `Telegram.WebApp.platform`
          examples: [Windows 11, ios]
        error:
          $ref: "#/components/schemas/FeedbackError"
        diagnostics:
          type: string
          description: Пакет сведений десктопа (F4), до 204 800 байт в UTF-8; только у `bug`

    FeedbackType:
      type: string
      description: "`bug` — «Ошибка», `idea` — «Идея», `other` — «Другое»"
      enum: [bug, idea, other]

    FeedbackError:
      type: object
      description: Ошибка, из которой открыли окно «Написать отзыв»
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: "`ErrorCode` десктопа"
          examples: [render_failed]
        traceId:
          type: string
          minLength: 1
          maxLength: 64
          examples: [7f3a-c21e]

    FeedbackCreated:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          description: Номер отзыва, «#41» в чате отзывов

    LinkRequestBody:
      type: object
      required: [name, os, installationId]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Имя компьютера, строка «Компьютер» на 18·1
          examples: [DESKTOP-7F3K2Q]
        os:
          $ref: "#/components/schemas/DeviceOs"
        installationId:
          type: string
          format: uuid
          description: Установка десктопа; по нему тот же компьютер узнаётся при повторной привязке
        platform:
          type: string
          maxLength: 64
          description: Строка «Система» на 18·1
          examples: [Windows 11]
        appVersion:
          type: string
          maxLength: 32
          description: Строка «Приложение» на 18·1
          examples: [0.3.1]

    LinkCreated:
      type: object
      required: [code, deepLink, pollToken, expiresAt]
      properties:
        code:
          type: string
          examples: [q2X9vKp4TfM8bR1cWz7nYA]
        deepLink:
          type: string
          description: Ссылка для кнопки «Открыть Telegram» и QR
          examples: ["https://t.me/StickerSnapAppBot?startapp=link_q2X9vKp4TfM8bR1cWz7nYA"]
        pollToken:
          type: string
          description: Секрет для `GET` и `DELETE /v1/links/{code}`
        expiresAt:
          type: string
          format: date-time

    LinkState:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: |
            `pending` — ждёт ответа; `linked` — «Привязать», ключ в этом ответе; `declined` —
            «Это не я»; `expired` — истёк или ключ уже выдан
          enum: [pending, linked, declined, expired]
        expiresAt:
          type: string
          format: date-time
          description: Только у `pending`
        deviceKey:
          type: string
          description: "Только у `linked`, приходит один раз; дальше `Authorization: Bearer <deviceKey>`"
        device:
          $ref: "#/components/schemas/Device"
        user:
          $ref: "#/components/schemas/LinkedUser"

    LinkedDevice:
      type: object
      required: [device, user]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        user:
          $ref: "#/components/schemas/LinkedUser"

    LinkedUser:
      type: object
      required: [id, firstName, botBlocked]
      properties:
        id:
          type: integer
          description: id пользователя Telegram
        firstName:
          type: string
        lastName:
          type: string
        username:
          type: string
          description: Без @
          examples: [dmitriu]
        botBlocked:
          type: boolean
          description: Человек остановил бота, уведомлений в чат не будет

    LinkRequest:
      type: object
      required: [code, name, os, requestedAt, expiresAt, linkedHere]
      properties:
        code:
          type: string
        name:
          type: string
          examples: [DESKTOP-7F3K2Q]
        os:
          $ref: "#/components/schemas/DeviceOs"
        platform:
          type: string
          examples: [Windows 11]
        appVersion:
          type: string
          examples: [0.3.1]
        requestedAt:
          type: string
          format: date-time
          description: Когда на десктопе нажали «Привязать»
        expiresAt:
          type: string
          format: date-time
        linkedHere:
          type: boolean
          description: Этот компьютер уже привязан к вам — Mini App подтверждает без вопроса

    LinkConfirmBody:
      type: object
      required: [notifications]
      additionalProperties: false
      properties:
        notifications:
          type: boolean
          description: Переключатель «Уведомления в чат»

    DeviceOs:
      type: string
      enum: [windows, macos, linux]

    UploadedSticker:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: "`file_id` загруженного .webm, для `InputSticker.file`"

    InputSticker:
      type: object
      required: [file, emoji]
      additionalProperties: false
      properties:
        file:
          type: string
          minLength: 1
          description: "`id` из `POST /v1/stickers/upload`"
        emoji:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
          examples: [["😴", "💤"]]

    NewPackBody:
      type: object
      required: [name, title, kind, stickers]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9_]{0,63}$"
          description: С суффиксом `_by_<бот>`
          examples: [reactions_call_by_StickerSnapAppBot]
        title:
          type: string
          minLength: 1
          maxLength: 64
          examples: [Реакции с созвона]
        kind:
          $ref: "#/components/schemas/PackKind"
        stickers:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/InputSticker"

    PublishedPack:
      type: object
      required: [name, title, kind, stickers]
      properties:
        name:
          type: string
          examples: [reactions_call_by_StickerSnapAppBot]
        title:
          type: string
          description: Как в Telegram, пак могли переименовать через @Stickers
        kind:
          $ref: "#/components/schemas/PackKind"
        stickers:
          type: array
          description: В порядке Telegram
          items:
            $ref: "#/components/schemas/PublishedSticker"

    PublishedSticker:
      type: object
      required: [id, uniqueId, emoji]
      properties:
        id:
          type: string
          description: "`file_id`: для замены, удаления и файла"
        uniqueId:
          type: string
          description: "`file_unique_id`: один для всех ботов и во времени, его хранит packs.json десктопа"
        emoji:
          type: array
          maxItems: 20
          description: Пусто, если Telegram не сказал
          items:
            type: string

    Problem:
      type: object
      description: |
        RFC 9457 Problem Details. `title` и `detail` — английский для журнала, в интерфейс не попадают.
      required: [type, status, title, code]
      properties:
        type:
          type: string
          examples: ["https://stickersnap.app/problems/unauthorized"]
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        code:
          $ref: "#/components/schemas/ErrorCode"
        params:
          type: object
          description: "{ retryAfterSec: 24 }"
          additionalProperties:
            type: [string, number]

    ErrorCode:
      type: string
      description: |
        | code | HTTP |
        | --- | --- |
        | `bad_request` | 400 |
        | `unauthorized` | 401 |
        | `bot_blocked` | 403 |
        | `pack_not_found`, `sticker_not_found`, `device_not_found`, `link_not_found` | 404 |
        | `pack_in_telegram`, `pack_name_taken`, `pack_full` | 409 |
        | `pack_name_invalid`, `validation_failed` | 422 |
        | `rate_limited` | 429 |
        | `internal` | 500 |
        | `telegram_error` | 502 |
      enum:
        - bad_request
        - unauthorized
        - pack_not_found
        - sticker_not_found
        - device_not_found
        - link_not_found
        - pack_in_telegram
        - bot_blocked
        - pack_name_taken
        - pack_full
        - pack_name_invalid
        - validation_failed
        - rate_limited
        - internal
        - telegram_error
