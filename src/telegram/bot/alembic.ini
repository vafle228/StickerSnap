# For writing migrations in development only: the service migrates itself at start
# (infrastructure/database/migrations.py). From src/telegram/bot:
#   uv run alembic revision --autogenerate -m "what changed"
#   uv run alembic upgrade head
[alembic]
script_location = %(here)s/src/stickersnap_bot/infrastructure/database/migrations
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///data/bot.sqlite3
