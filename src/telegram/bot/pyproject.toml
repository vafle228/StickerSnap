[project]
name = "stickersnap-bot"
version = "0.1.0"
description = "StickerSnap Telegram bot and its HTTP API for the desktop app and the Mini App"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi>=0.143.3",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
stickersnap-bot = "stickersnap_bot.main:main"
stickersnap-bot-launch-data = "stickersnap_bot.main:print_launch_data"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC", "PT"]

[tool.ruff.lint.per-file-ignores]
# the bot's Russian texts, and the tests that read them: Cyrillic letters are no confusables there
"src/stickersnap_bot/application/chat_texts.py" = ["RUF001"]
"tests/**" = ["RUF001"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# warnings are errors, as in the .NET server
filterwarnings = ["error"]
asyncio_default_fixture_loop_scope = "function"

# Dependencies point only inwards, like the server's layer tests (ArchUnitNET):
# api and infrastructure never import each other; main.py is the only composition root.
[tool.importlinter]
root_package = "stickersnap_bot"

[[tool.importlinter.contracts]]
name = "Layers point inwards"
type = "layers"
layers = [
    "stickersnap_bot.main",
    "stickersnap_bot.api | stickersnap_bot.infrastructure",
    "stickersnap_bot.application",
    "stickersnap_bot.domain",
]
