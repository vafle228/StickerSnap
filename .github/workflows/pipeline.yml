name: Pipeline

# The tests of every push to every branch, in three stages the way a GitLab pipeline reads:
#
#   check ─→ build ─→ test ─→ test-slow ─→ Pipeline passed
#
# A job starts when the jobs it needs have passed; jobs of one stage run in parallel. Fast tests
# come first and the slow ones (e2e, real FFmpeg) only after them, so a slow or flaky e2e never
# holds up the fast loop (the test pyramid). "Pipeline passed" is the one required check of main.
#
# The installers are not built here: that is the manual workflow "Build app" (build-app.yml), which
# takes the production SPA of the run that passed on the commit (spa-dist) instead of building it again.
# Shared setup steps live in .github/actions.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  # "Run workflow" re-runs the tests of any branch by hand
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true

jobs:
  # ─────────────────────── check · static checks, nothing is built ───────────────────────

  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      # openapi.yaml is valid, schema.d.ts was regenerated after its last change and compiles strict
      - run: npm run check:api
      - run: npm run typecheck:api

  web-lint:
    name: SPA lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      # tokens.css was regenerated after the last change of tokens.json
      - run: npm run check:tokens
      - run: npm run format:check
      - run: npm run lint

  desktop-lint:
    name: Desktop shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      - run: npm run lint -w src/desktop
      # tsc strict over the main process, the preload, the tests and the e2e
      - run: npm run typecheck -w src/desktop

  miniapp-lint:
    name: Mini App lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      - run: npm run lint -w src/telegram/miniapp
      # tsc strict over the Mini App, its tests and its e2e
      - run: npm run typecheck -w src/telegram/miniapp

  bot-lint:
    name: Bot lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/uv
      - run: uv run ruff format --check .
        working-directory: src/telegram/bot
      - run: uv run ruff check .
        working-directory: src/telegram/bot
      # mypy --strict over the service and its tests
      - run: uv run mypy
        working-directory: src/telegram/bot
      # the layers point inwards (pyproject.toml, [tool.importlinter])
      - run: uv run lint-imports
        working-directory: src/telegram/bot

  # Reports vulnerable packages; never fails the pipeline (GitLab's allow_failure)
  dependency-check:
    name: Dependency check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      - uses: ./.github/actions/dotnet
      - run: npm audit --audit-level=high
      - name: NuGet vulnerabilities
        working-directory: src/server
        run: |
          dotnet list StickerSnap.slnx package --vulnerable --include-transitive | tee nuget-audit.txt
          ! grep -q "has the following vulnerable packages" nuget-audit.txt

  # ─────────────────────── build · once, handed on as artifacts ───────────────────────

  build-web:
    name: Build SPA
    needs: [contract, web-lint, desktop-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      # tsc -b (strict) + vite build into src/server/StickerSnap.Api/wwwroot
      - run: npm run build
      # the production build carries no demo data, dev bar or showcase
      - run: npm run check:prod-build
      - uses: actions/upload-artifact@v7
        with:
          name: spa-dist
          path: src/server/StickerSnap.Api/wwwroot
          retention-days: 7
          if-no-files-found: error

  build-server:
    name: Build server
    needs: [contract, web-lint, desktop-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet
      - run: dotnet build StickerSnap.slnx -c Release
        working-directory: src/server
      # bin and obj in one tarball, so the test jobs get the same layout back (actions/server-build)
      - run: find src/server -type d \( -name bin -o -name obj \) -prune -print0 | tar --null -czf server-build.tgz -T -
      - uses: actions/upload-artifact@v7
        with:
          name: server-build
          path: server-build.tgz
          retention-days: 7
          if-no-files-found: error

  # The Telegram Mini App (src/telegram/miniapp): the production build Telegram opens; hosting is O1
  build-miniapp:
    name: Build Mini App
    needs: [contract, miniapp-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      - run: npm run build:miniapp
      # no demo data or dev bar in what Telegram opens
      - run: npm run check:prod-build -- src/telegram/miniapp/dist
      - uses: actions/upload-artifact@v7
        with:
          name: miniapp-dist
          path: src/telegram/miniapp/dist
          retention-days: 7
          if-no-files-found: error

  # The image the VPS runs (docker/telegram); pushing it is the manual workflow "Deploy bot"
  build-bot:
    name: Build bot image
    needs: [bot-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/telegram/Dockerfile -t stickersnap-bot src/telegram/bot

  # The VPS's front: Caddy with the Mini App this run built. Checks the Caddyfile and the
  # production compose file the deploy copies to the VPS, so a broken one never reaches it.
  build-bot-web:
    name: Build bot web image
    needs: [build-miniapp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: miniapp-dist
          path: miniapp-dist
      - run: >-
          docker build -f docker/telegram/Dockerfile.web --build-context miniapp=miniapp-dist
          -t stickersnap-web docker/telegram
      - run: >-
          docker run --rm -e DOMAIN=bot.example.com stickersnap-web
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      # .env is written on the VPS by hand; an empty one stands in for it here
      - run: touch .env && DOMAIN=bot.example.com docker compose -f compose.prod.yaml config -q
        working-directory: docker/telegram
      # Telemetry is behind a flag (deploy-bot.yml, variable TELEMETRY): off by default, the stack
      # does not run and the bot exports nothing; the profile turns both on
      - name: Telemetry flag
        working-directory: docker/telegram
        env:
          DOMAIN: bot.example.com
        run: |
          off=$(docker compose -f compose.prod.yaml config --services | sort | tr '\n' ' ')
          [ "$off" = "backup bot web " ] || { echo "::error::Telemetry off runs: $off"; exit 1; }
          docker compose -f compose.prod.yaml config --format json \
            | jq -e '.services.bot.environment.OTEL_EXPORTER_OTLP_ENDPOINT == ""' > /dev/null
          on=$(COMPOSE_PROFILES=telemetry docker compose -f compose.prod.yaml config --services | sort | tr '\n' ' ')
          [ "$on" = "alloy backup bot loki prometheus tempo web " ] || { echo "::error::Telemetry on runs: $on"; exit 1; }
      # The observability stack's configs, checked by the images the VPS runs (observability/compose.yaml)
      - name: Observability configs
        working-directory: docker/telegram/observability
        run: |
          docker run --rm -v "$PWD/prometheus:/cfg:ro" --entrypoint promtool prom/prometheus:v3.15.1 \
            check config /cfg/prometheus.yml
          docker run --rm -v "$PWD/loki:/cfg:ro" grafana/loki:3.7.9 -config.file=/cfg/loki.yaml -verify-config
          docker run --rm -v "$PWD/alloy:/cfg:ro" grafana/alloy:v1.21.2 fmt /cfg/config.alloy > /dev/null

  # ─────────────────────── test · fast unit and integration tests ───────────────────────

  web-unit:
    name: SPA tests
    needs: [build-web, build-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      # unit and contract tests in node, component tests (*.test.tsx) in happy-dom
      - run: npm test

  desktop-unit:
    name: Desktop shell tests
    needs: [build-web, build-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      # unit tests of the shell in node; the real app is smoke-tested in "Build app"
      - run: npm test -w src/desktop

  server-fast:
    name: Server tests
    needs: [build-web, build-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet
      - uses: ./.github/actions/server-build
      # Unit, architecture and WebApplicationFactory tests; Category=Slow runs in test-slow.
      # The test project is an xUnit v3 executable with its own runner (-trait- excludes a trait):
      # it runs straight from the build stage's output, nothing is compiled again. (dotnet test --no-build finds
      # "no test projects" in an unpacked build, and without --no-build it recompiles everything.)
      - run: dotnet StickerSnap.Tests.dll -trait- "Category=Slow"
        working-directory: src/server/StickerSnap.Tests/bin/Release/net10.0

  miniapp-unit:
    name: Mini App tests
    needs: [build-miniapp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      # unit and contract tests in node, component tests (*.test.tsx) in happy-dom
      - run: npm test -w src/telegram/miniapp

  bot-unit:
    name: Bot tests
    needs: [build-bot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/uv
      # unit, FastAPI through httpx and the layer contract; nothing reaches Telegram
      - run: uv run pytest
        working-directory: src/telegram/bot

  # ─────────────────────── test-slow · after the fast tests, in parallel ───────────────────────

  # Real FFmpeg on clips the pinned build makes with lavfi, and the corpus of 30 GIFs (90% gate);
  # the pinned yt-dlp on a clip served from 127.0.0.1. Real sites (Category=Online) only by hand.
  render-slow:
    name: Slow server tests
    needs: [web-unit, desktop-unit, server-fast]
    runs-on: ubuntu-latest
    env:
      StickerSnap__FfmpegDir: ${{ github.workspace }}/tools/ffmpeg/linux-x64
      StickerSnap__YtDlpDir: ${{ github.workspace }}/tools/yt-dlp/linux-x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/dotnet
      - uses: ./.github/actions/server-build
      - uses: ./.github/actions/pinned-ffmpeg
      - uses: ./.github/actions/pinned-ytdlp
      # Straight from the build stage's output, as in "Server tests"
      - run: dotnet StickerSnap.Tests.dll -trait "Category=Slow" -trait- "Category=Online"
        working-directory: src/server/StickerSnap.Tests/bin/Release/net10.0

  # A few whole user paths in Chromium against Vite on demo data
  e2e:
    name: E2E (Chromium)
    needs: [web-unit, desktop-unit, server-fast]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      - uses: ./.github/actions/playwright
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            src/web/playwright-report
            src/web/test-results
          retention-days: 7

  # The critical path in Chromium on the real server: the production SPA and the server of the
  # build stage and the pinned FFmpeg. Import, an edit, the exact preview and the export of a
  # real WEBM (src/web/e2e-server).
  e2e-server:
    name: E2E on the server
    needs: [web-unit, desktop-unit, server-fast]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      - uses: ./.github/actions/dotnet
      - uses: ./.github/actions/server-build
      - uses: actions/download-artifact@v8
        with:
          name: spa-dist
          path: src/server/StickerSnap.Api/wwwroot
      - uses: ./.github/actions/pinned-ffmpeg
      - uses: ./.github/actions/playwright
      # CI is set, so the server runs from the build stage's output (dotnet run --no-build)
      - run: npm run e2e:server
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-server
          path: |
            src/web/playwright-report
            src/web/test-results
          retention-days: 7

  # The Mini App's critical path in a phone-sized Chromium on demo data (src/telegram/miniapp/e2e)
  miniapp-e2e:
    name: Mini App E2E
    needs: [miniapp-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      - uses: ./.github/actions/playwright
      - run: npm run e2e -w src/telegram/miniapp
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-miniapp
          path: |
            src/telegram/miniapp/playwright-report
            src/telegram/miniapp/test-results
          retention-days: 7

  # ─────────────────────── one status for the whole pipeline ───────────────────────

  # Green when no job failed or was cancelled. The required check of main.
  gate:
    name: Pipeline passed
    if: ${{ !cancelled() }}
    needs: [contract, web-lint, desktop-lint, miniapp-lint, bot-lint, build-web, build-server, build-miniapp, build-bot, build-bot-web, web-unit, desktop-unit, server-fast, miniapp-unit, bot-unit, render-slow, e2e, e2e-server, miniapp-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
