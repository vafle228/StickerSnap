name: Pipeline

# One pipeline in three stages, the way a GitLab pipeline reads: check → build → test.
# A job starts when every job of the stage before it has passed (needs); jobs of one stage run
# in parallel. The tests always run, on every push to every branch, so the state of a branch
# is always known:
#   check → build → fast tests (SPA, desktop, server) → e2e, e2e on the server, slow server tests
# The installers are not built here: that is the manual workflow "Build app" (build-app.yml),
# one "Run workflow" button in Actions, or a tag v*.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  # "Run workflow" re-runs the tests on any branch by hand
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  DOTNET_VERSION: 10.0.x
  DOTNET_NOLOGO: true

jobs:
  # ───────────────────────────── stage 1 · check ─────────────────────────────
  # Fast static checks. Nothing is built here.

  dependency-check:
    name: Dependency check
    runs-on: ubuntu-latest
    # Reports vulnerable packages, never fails the pipeline (allow_failure)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: npm audit --audit-level=high
      - name: NuGet vulnerabilities
        working-directory: src/server
        run: |
          dotnet list StickerSnap.slnx package --vulnerable --include-transitive | tee nuget-audit.txt
          ! grep -q "has the following vulnerable packages" nuget-audit.txt

  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # openapi.yaml is valid and schema.d.ts was regenerated after the last change
      - run: npm run check:api
      # generated types compile under TypeScript strict
      - run: npm run typecheck:api

  web-lint:
    name: SPA lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # tokens.css was regenerated after the last change of tokens.json
      - run: npm run check:tokens
      - run: npm run format:check
      - run: npm run lint

  desktop-lint:
    name: Desktop shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint -w src/desktop
      # tsc strict over the main process, the preload, the tests and the e2e
      - run: npm run typecheck -w src/desktop

  # ───────────────────────────── stage 2 · build ─────────────────────────────
  # Each job builds once and hands the result to the test stage as an artifact.

  build-web:
    name: Build SPA
    needs: [contract, web-lint, desktop-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # tsc -b (strict) + vite build into src/server/StickerSnap.Api/wwwroot
      - run: npm run build
      # the production build carries no demo data, dev bar or showcase
      - run: npm run check:prod-build
      - uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          path: src/server/StickerSnap.Api/wwwroot
          retention-days: 7
          if-no-files-found: error

  build-server:
    name: Build server
    needs: [contract, web-lint, desktop-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet build StickerSnap.slnx -c Release
        working-directory: src/server
      # bin and obj go in one tarball, so the test jobs get the same layout back
      - run: find src/server -type d \( -name bin -o -name obj \) -prune -print0 | tar --null -czf server-build.tgz -T -
      - uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: server-build.tgz
          retention-days: 7
          if-no-files-found: error

  # ───────────────────────────── stage 3 · test ─────────────────────────────
  # Fast tests first of all (the test pyramid): unit and integration tests wait for nothing slow.

  web-unit:
    name: SPA tests
    needs: [build-web, build-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # unit and contract tests in node, component tests (*.test.tsx) in happy-dom
      - run: npm test

  desktop-unit:
    name: Desktop shell tests
    needs: [build-web, build-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # unit tests of the shell in node; the real app runs in the "Build app" workflow
      - run: npm test -w src/desktop

  server-fast:
    name: Server tests
    needs: [build-web, build-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: server-build
      - run: tar -xzf server-build.tgz
      # No --no-build: dotnet test finds no test projects in unpacked build output, so it checks
      # the unpacked bin/obj are up to date and builds only what is not.
      # xUnit on Microsoft.Testing.Platform (src/server/global.json): unit, architecture and
      # WebApplicationFactory tests; the ones tagged Category=Slow run in "Slow server tests"
      - run: dotnet test --solution StickerSnap.slnx -c Release --filter-not-trait "Category=Slow"
        working-directory: src/server

  # Runs after the fast tests, on every push. Real FFmpeg on clips the pinned build makes with
  # lavfi, and the corpus of 30 GIFs rendered as stickers (90% gate).
  render-slow:
    name: Slow server tests
    needs: [web-unit, desktop-unit, server-fast]
    runs-on: ubuntu-latest
    env:
      StickerSnap__FfmpegDir: ${{ github.workspace }}/tools/ffmpeg/linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: server-build
      - run: tar -xzf server-build.tgz

      # The pinned build and its SHA-256 live in the script, so the script is the cache key
      - uses: actions/cache@v4
        with:
          path: tools/ffmpeg/linux-x64
          key: ffmpeg-linux-x64-${{ hashFiles('tools/fetch-ffmpeg.mjs') }}

      - run: node tools/fetch-ffmpeg.mjs linux-x64

      - run: dotnet test --solution StickerSnap.slnx -c Release --filter-trait "Category=Slow"
        working-directory: src/server

  # A few whole user paths in Chromium against Vite on demo data. Runs after the fast tests, in
  # parallel with the slow server tests, so a slow or flaky e2e never holds up the fast loop.
  e2e:
    name: E2E (Chromium)
    needs: [web-unit, desktop-unit, server-fast]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browser comes from the cache; the system libraries are installed every time
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - run: npx playwright install --with-deps chromium
        working-directory: src/web

      - run: npm run e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/web/playwright-report
            src/web/test-results
          retention-days: 7

  # The critical path in Chromium on the real server: the production SPA of the build stage, the
  # server of the build stage and the pinned FFmpeg. Import, an edit, the exact preview and the
  # export of a real WEBM (src/web/e2e-server). After the fast tests, beside the other e2e.
  e2e-server:
    name: E2E on the server
    needs: [web-unit, desktop-unit, server-fast]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: npm ci

      # The very builds of the build stage: the server (bin and obj) and the production SPA
      - uses: actions/download-artifact@v4
        with:
          name: server-build
      - run: tar -xzf server-build.tgz
      - uses: actions/download-artifact@v4
        with:
          name: spa-dist
          path: src/server/StickerSnap.Api/wwwroot

      - uses: actions/cache@v4
        with:
          path: tools/ffmpeg/linux-x64
          key: ffmpeg-linux-x64-${{ hashFiles('tools/fetch-ffmpeg.mjs') }}
      - run: node tools/fetch-ffmpeg.mjs linux-x64

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
        working-directory: src/web

      # CI is set, so the server runs from the build stage's output (dotnet run --no-build)
      - run: npm run e2e:server

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-server
          path: |
            src/web/playwright-report
            src/web/test-results
          retention-days: 7

  # One status for the whole pipeline: green when no job of any stage failed. Put this one into the required checks of main.
  gate:
    name: Pipeline passed
    if: ${{ !cancelled() }}
    needs: [contract, web-lint, desktop-lint, build-web, build-server, web-unit, desktop-unit, server-fast, render-slow, e2e, e2e-server]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
