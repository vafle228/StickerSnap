name: Build app

# The GitLab "play" button: Actions → "Build app" → "Run workflow" → pick a branch → Run.
# Builds the Windows and Linux installers from that branch, smoke-tests each unpacked app and
# attaches them to the run (Artifacts at the bottom of the run page). Also runs on a tag v*.
#
# Only a commit "Pipeline" passed gets installers, and they carry what that run built and tested:
# the production SPA comes from its artifact spa-dist, nothing is built twice and the tests are not
# repeated. When Pipeline is still running on the commit (a tag pushed with a new commit), this
# waits for it. The server is published here, self-contained and single-file for each system:
# that is another build than Pipeline's portable `dotnet build`, so there is nothing to take over.
# The pinned FFmpeg goes in next to the server (tools/fetch-ffmpeg.mjs, checked by SHA-256).
# Shared setup steps live in .github/actions.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # to find the Pipeline run of the commit and download its artifact
  actions: read

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true

jobs:
  # The Pipeline run that passed on this commit and still has its production SPA (7 days)
  pipeline:
    name: Pipeline of the commit
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 90); do
            runs=$(gh run list -R "$REPO" --workflow pipeline.yml --commit "$SHA" -L 50               --json databaseId,status,conclusion)
            for id in $(jq -r '.[] | select(.conclusion == "success") | .databaseId' <<<"$runs"); do
              spa=$(gh api "repos/$REPO/actions/runs/$id/artifacts"                 --jq '[.artifacts[] | select(.name == "spa-dist" and (.expired | not))] | length')
              if [ "$spa" != 0 ]; then
                echo "run-id=$id" >> "$GITHUB_OUTPUT"
                echo "✅ Pipeline run $id passed on $SHA: its SPA goes into the installers" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            done
            if [ "$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")" = 0 ]; then
              echo "::error::No Pipeline run passed on $SHA with its SPA still kept (7 days): run Pipeline on this branch (Actions → Pipeline → Run workflow), then this again"
              exit 1
            fi
            echo "Pipeline is still running on $SHA, waiting for it"
            sleep 30
          done
          echo "::error::Pipeline did not finish on $SHA in 45 minutes"
          exit 1

  package:
    # Static name: GitHub appends the matrix values itself, "Installer (Windows, ...)"
    name: Installer
    needs: pipeline
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            rid: win-x64
            app: release/win-unpacked/StickerSnap.exe
            installers: |
              src/desktop/release/*.exe
          - name: Linux
            os: ubuntu-latest
            rid: linux-x64
            app: release/linux-unpacked/stickersnap
            installers: |
              src/desktop/release/*.AppImage
              src/desktop/release/*.deb
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/node
      - uses: ./.github/actions/dotnet

      # The production SPA Pipeline built, checked and tested (never the dev build with the demo data)
      - uses: actions/download-artifact@v4
        with:
          name: spa-dist
          path: src/server/StickerSnap.Api/wwwroot
          run-id: ${{ needs.pipeline.outputs.run-id }}
          github-token: ${{ github.token }}

      # The self-contained server into server-dist, then the installers
      - run: npm run server -w src/desktop -- ${{ matrix.rid }}

      - uses: ./.github/actions/pinned-ffmpeg
        with:
          rid: ${{ matrix.rid }}

      - run: npm run dist -w src/desktop

      # Ubuntu 24.04 forbids the user namespaces Chromium's sandbox needs on CI runners
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Smoke e2e
        working-directory: src/desktop
        shell: bash
        env:
          STICKERSNAP_APP: ${{ github.workspace }}/src/desktop/${{ matrix.app }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npx playwright test; else npx playwright test; fi

      - uses: actions/upload-artifact@v4
        with:
          name: StickerSnap-${{ matrix.rid }}
          path: ${{ matrix.installers }}
          retention-days: 14
          if-no-files-found: error

      - name: Where to download
        shell: bash
        env:
          LINE: "✅ ${{ matrix.name }}: the installer is the artifact StickerSnap-${{ matrix.rid }} at the bottom of this page"
        run: echo "$LINE" >> "$GITHUB_STEP_SUMMARY"

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-report-${{ matrix.rid }}
          path: |
            src/desktop/playwright-report
            src/desktop/test-results
          retention-days: 7
