name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # openapi.yaml is valid and schema.d.ts was regenerated after the last change
      - run: npm run check:api

      # generated types compile under TypeScript strict
      - run: npm run typecheck:api

  web:
    name: SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # tokens.css was regenerated after the last change of tokens.json
      - run: npm run check:tokens

      - run: npm run format:check

      - run: npm run lint

      # unit and contract tests in node, component tests (*.test.tsx) in happy-dom
      - run: npm test

      # tsc -b (strict) + vite build into src/server/wwwroot
      - run: npm run build

  desktop:
    name: Desktop shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Electron 40+ needs Node 22; no Electron binary is downloaded here
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint -w src/desktop

      # tsc strict over the main process, the preload, the tests and the e2e
      - run: npm run typecheck -w src/desktop

      # unit tests of the shell in node; the real app runs in workflow «Desktop»
      - run: npm test -w src/desktop

  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet build StickerSnap.slnx -c Release

      # xUnit on Microsoft.Testing.Platform (global.json), WebApplicationFactory
      - run: dotnet test --solution StickerSnap.slnx -c Release --no-build
