name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # openapi.yaml is valid and schema.d.ts was regenerated after the last change
      - run: npm run check:api

      # generated types compile under TypeScript strict
      - run: npm run typecheck:api
