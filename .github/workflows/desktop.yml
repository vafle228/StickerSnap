name: Desktop

# Installers of the desktop app for Windows and Linux, and a smoke e2e of each unpacked build
# (src/desktop/e2e): the real shell starts the real server. Its own workflow like E2E, so the
# fast checks in CI never wait for a packaging run and a red run here does not block a merge.

on:
  pull_request:
    paths:
      - "src/desktop/**"
      - "src/server/**"
      - "src/web/**"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            rid: win-x64
            app: release/win-unpacked/StickerSnap.exe
            installers: |
              src/desktop/release/*.exe
          - name: Linux
            os: ubuntu-latest
            rid: linux-x64
            app: release/linux-unpacked/stickersnap
            installers: |
              src/desktop/release/*.AppImage
              src/desktop/release/*.deb
    steps:
      - uses: actions/checkout@v4

      # Electron 40+ and its download need Node 22
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: npm ci

      # The SPA into the server's wwwroot, then the self-contained server into server-dist
      - run: npm run build

      - run: npm run server -w src/desktop -- ${{ matrix.rid }}

      - run: npm run dist -w src/desktop

      # Ubuntu 24.04 forbids the user namespaces Chromium's sandbox needs on CI runners
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Smoke e2e
        working-directory: src/desktop
        shell: bash
        env:
          STICKERSNAP_APP: ${{ github.workspace }}/src/desktop/${{ matrix.app }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npx playwright test; else npx playwright test; fi

      - uses: actions/upload-artifact@v4
        with:
          name: StickerSnap-${{ matrix.rid }}
          path: ${{ matrix.installers }}
          retention-days: 14

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-report-${{ matrix.rid }}
          path: |
            src/desktop/playwright-report
            src/desktop/test-results
          retention-days: 7
